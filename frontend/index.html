kground:transparent}#chat::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}.welcome{text-align:center;color:var(--text3);font-size:13px;line-height:1.8;padding:60px 20px}.welcome .title{font-size:22px;color:var(--text2);margin-bottom:8px}.welcome .features{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px}.welcome .features span{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 14px;font-size:12px;color:var(--text2)}.msg-row{display:flex;gap:10px;animation:fadeIn .25s ease-out}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.msg-row.user{flex-direction:row;justify-content:flex-end}.msg-row .avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px}.msg-row.user .avatar{background:var(--accent);color:#fff}.msg-row.assistant .avatar{background:var(--accent);border:none;color:#fff}.msg-bubble{max-width:75%;padding:10px 16px;border-radius:var(--radius);font-size:14px;line-height:1.65;word-wrap:break-word}.msg-row.user .msg-bubble{background:var(--accent);color:#fff;border-bottom-right-radius:4px}.msg-row.assistant .msg-bubble{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px}.msg-bubble .time{display:block;font-size:9px;color:inherit;opacity:.45;margin-top:4px}.msg-row.user .msg-bubble .time{text-align:right}.msg-bubble code{font-size:13px;background:rgba(0,0,0,.15);padding:1px 6px;border-radius:4px;font-family:'SF Mono',Menlo,Consolas,monospace}.msg-bubble pre{margin:8px 0;padding:12px;border-radius:var(--radius-sm);background:#0a0a14;overflow-x:auto;font-size:13px;line-height:1.5;font-family:'SF Mono',Menlo,Consolas,monospace}.think-row{display:flex;gap:10px}.think-row .indent{width:42px;flex-shrink:0}.think-bubble{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);border-left:3px solid var(--accent);overflow:hidden}.think-bubble summary{padding:8px 14px;cursor:pointer;font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px;user-select:none;list-style:none}.think-bubble summary::-webkit-details-marker{display:none}.think-bubble .think-content{padding:8px 14px 12px;font-size:13px;color:var(--text2);line-height:1.6;white-space:pre-wrap;border-top:1px solid var(--border)}.typing{display:flex;gap:4px;padding:4px 0}.typing span{width:6px;height:6px;border-radius:50%;background:var(--text3);display:inline-block;animation:bounce 1.2s infinite}.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}#input-area{padding:12px 16px;border-top:1px solid var(--border);background:var(--bg);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);flex-shrink:0}.input-wrap{display:flex;gap:8px;align-items:flex-end;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:4px 4px 4px 16px;transition:border-color .15s}.input-wrap:focus-within{border-color:var(--accent)}.input-wrap textarea{flex:1;padding:8px 0;border:none;background:transparent;color:var(--text);font-size:14px;resize:none;outline:none;font-family:var(--font);line-height:1.5;max-height:100px;min-height:24px}.input-wrap textarea::placeholder{color:var(--text3)}
[data-theme="dark"] header{background:rgba(26,20,23,.85)}[data-theme="dark"] #input-area{background:rgba(26,20,23,.85)}.input-wrap button{width:40px;height:40px;border:none;border-radius:var(--radius-sm);background:var(--accent);color:#fff;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}.input-wrap button:hover{opacity:.85;transform:scale(1.05)}.input-wrap button:active{transform:scale(.95)}.input-wrap button:disabled{opacity:.3;cursor:not-allowed;transform:none}.panel{display:none;position:fixed;top:0;right:0;bottom:0;width:380px;max-width:100vw;background:var(--surface);border-left:1px solid var(--border);z-index:100;flex-direction:column;box-shadow:-8px 0 40px rgba(0,0,0,.4)}.panel.open{display:flex;animation:slideIn .2s ease-out}@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}.panel-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}.panel-header h3{font-size:14px;font-weight:600}.panel-header .close{background:none;border:none;color:var(--text3);font-size:18px;cursor:pointer;padding:4px}.panel-body{flex:1;overflow-y:auto;padding:12px 16px}.panel-body .item{padding:10px 12px;background:var(--surface2);border-radius:var(--radius-sm);margin-bottom:8px;font-size:13px;line-height:1.5}.panel-body .item .label{font-size:11px;color:var(--text3);margin-bottom:4px}.overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:99}.overlay.open{display:block}@media(max-width:600px){.msg-bubble{max-width:85%;font-size:14px}.panel{width:100%}header{padding:6px 8px;min-height:auto;gap:4px}header .logo .icon{width:26px;height:26px;font-size:13px}header .logo span{font-size:12px}.header-actions{gap:3px;flex-shrink:1;min-width:0}.header-actions select{max-width:80px;font-size:9px;padding:3px 16px 3px 4px}.header-actions .btn-icon{width:28px;height:28px;font-size:12px}#chat{padding:10px;gap:12px}#input-area{padding:6px 8px}.input-wrap textarea{font-size:13px}.msg-row .avatar{width:26px;height:26px;font-size:11px}.msg-bubble{padding:8px 12px;font-size:13px}#settings-panel .setting-textarea{min-height:60px;font-size:11px}#settings-panel .setting-item{flex-wrap:wrap;gap:4px}.btn-upload{font-size:10px!important;padding:3px 6px!important}.av-pick{grid-template-columns:repeat(5,1fr)!important;gap:3px!important}.av-pick .av-opt{width:28px!important;height:28px!important;font-size:13px!important}}

</style></head><body><header><div class="logo"><div class="icon">AI</div><span>Companion</span></div><div class="header-actions"><select id="model-select"><option value="z-ai/glm-5.2" selected>GLM-5.2 (推荐)</option><option value="z-ai/glm-4.7">GLM-4.7 (智谱)</option><option value="qwen/qwen-2.5-72b-instruct">Qwen 2.5 (通义千问)</option><option value="openai/o3-mini">o3-mini (快速)</option><option value="anthropic/claude-sonnet-4-20250514">Claude Sonnet 4 (平衡)</option><option value="deepseek/deepseek-r1">DeepSeek R1 (深度推理)</option></select><button class="btn-icon" onclick="toggleTheme()" id="theme-btn" title="Theme">&#9788;</button><button class="btn-icon" onclick="toggleSettings()" id="settings-btn" title="Settings">&#9881;</button><button class="btn-icon" onclick="location.reload()" title="Refresh">&#x21BB;</button><button class="btn-icon" onclick="togglePanel('memories')" title="Memories">&#128214;</button></div></header><div id="chat"><div class="welcome"><div class="title">&#x1F9D0; AI Companion</div><div class="features"><span>&#x1F9E0; &#x63A8;&#x7406;</span><span>&#x1F4BB; &#x4EE3;&#x7801;</span><span>&#x1F4C4; &#x6587;&#x4EF6;</span><span>&#x1F4DA; &#x8BB0;&#x5FC6;</span></div></div></div><div id="input-area"><div class="input-wrap"><textarea id="input" rows="1" placeholder="&#x8F93;&#x5165;&#x6D88;&#x606F;..." onkeydown="handleKey(event)"></textarea><button class="btn-icon" onclick="location.reload()" title="Refresh" style="background:none;border:none;color:grey;font-size:16px;cursor:pointer;flex-shrink:0;width:32px;height:32px">↻</button><button id="send-btn" onclick="send()">&#10148;</button></div></div><div class="panel" id="settings-panel"><div class="panel-header"><h3>设置</h3><button class="close" onclick="closePanel()">&#10005;</button></div><div class="panel-body"><div class="sec-hdr">◆ 模型</div><div class="setting-item"><span>默认模型</span><select id="settings-model-select" onchange="modelSelectChange(this.value)"></select></div><div class="sec-hdr">♥ 用户头像</div><div class="setting-item" style="flex-direction:column"><div class="av-upload-row"><span class="btn-upload" onclick="document.getElementById('file-userAvatar').click()">↑ 上传</span><input type="file" id="file-userAvatar" accept="image/*" style="display:none" onchange="handleUpload('userAvatar',this)"></div><div class="av-pick" id="av-pick-userAvatar"><div class="av-opt" onclick="pickAvatar('userAvatar',this)">☀</div><div class="av-opt" onclick="pickAvatar('userAvatar',this)">☁</div><div class="av-opt" onclick="pickAvatar('userAvatar',this)">♥</div><div class="av-opt" onclick="pickAvatar('userAvatar',this)">★</div><div class="av-opt" onclick="pickAvatar('userAvatar',this)">♣</div><div class="av-opt" onclick="pickAvatar('userAvatar',this)">♦</div><div class="av-opt" onclick="pickAvatar('userAvatar',this)">♠</div><div class="av-opt" onclick="pickAvatar('userAvatar',this)">◆</div><div class="av-opt" onclick="pickAvatar('userAvatar',this)">▲</div><div class="av-opt" onclick="pickAvatar('userAvatar',this)">●</div></div></div><div class="sec-hdr">♥ AI 头像</div><div class="setting-item" style="flex-direction:column"><div class="av-upload-row"><span class="btn-upload" onclick="document.getElementById('file-aiAvatar').click()">↑ 上传</span><input type="file" id="file-aiAvatar" accept="image/*" style="display:none" onchange="handleUpload('aiAvatar',this)"></div><div class="av-pick" id="av-pick-aiAvatar"><div class="av-opt" onclick="pickAvatar('aiAvatar',this)">☀</div><div class="av-opt" onclick="pickAvatar('aiAvatar',this)">☁</div><div class="av-opt" onclick="pickAvatar('aiAvatar',this)">♥</div><div class="av-opt" onclick="pickAvatar('aiAvatar',this)">★</div><div class="av-opt" onclick="pickAvatar('aiAvatar',this)">♣</div><div class="av-opt" onclick="pickAvatar('aiAvatar',this)">♦</div><div class="av-opt" onclick="pickAvatar('aiAvatar',this)">♠</div><div class="av-opt" onclick="pickAvatar('aiAvatar',this)">◆</div><div class="av-opt" onclick="pickAvatar('aiAvatar',this)">▲</div><div class="av-opt" onclick="pickAvatar('aiAvatar',this)">●</div></div></div><div class="sec-hdr">◆ 系统提示词</div><div class="setting-item" style="flex-direction:column;align-items:stretch;gap:8px"><span>系统提示词</span><textarea class="setting-textarea" id="system-prompt-editor" placeholder="输入自定义系统提示词…"></textarea><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn-danger" style="background:var(--text3);padding:4px 12px;font-size:11px" onclick="resetSystemPrompt()">恢复默认</button><button style="padding:4px 12px;border:none;border-radius:6px;background:var(--accent);color:#fff;font-size:11px;cursor:pointer" onclick="saveSystemPrompt()">保存</button></div></div><div class="sec-hdr">◆ 参数</div><div class="setting-item" style="height:auto;flex-wrap:wrap"><span>模型参数</span><div class="slider-row" style="width:100%;padding-top:8px"><span style="font-size:11px;color:var(--text3);width:100px">温度 Temperature</span><input type="range" id="slider-temperature" min="0" max="2" step="0.1" value="0.7" oninput="updateSliderValue(this)"><span class="slider-value" id="val-temperature">0.7</span></div><div class="slider-row" style="width:100%"><span style="font-size:11px;color:var(--text3);width:100px">Top P</span><input type="range" id="slider-topp" min="0" max="1" step="0.05" value="0.9" oninput="updateSliderValue(this)"><span class="slider-value" id="val-topp">0.9</span></div><div class="slider-row" style="width:100%"><span style="font-size:11px;color:var(--text3);width:100px">最大 Token</span><input type="range" id="slider-maxtokens" min="256" max="32000" step="256" value="16000" oninput="updateSliderValue(this)"><span class="slider-value" id="val-maxtokens">16000</span></div></div><div class="sec-hdr">◆ 显示</div><div class="setting-item"><span>主题模式</span><select id="theme-select" onchange="themeSelectChange(this.value)"><option value="light">浅色</option><option value="dark">深色</option></select></div><div class="setting-item"><span>思考链显示</span><select id="think-mode" onchange="thinkModeChange(this.value)"><option value="auto">自动折叠</option><option value="show">始终展开</option><option value="hide">始终隐藏</option></select></div><div class="setting-item"><span>记忆管理</span><button class="btn-danger" onclick="clearAllData()">清空记忆和对话</button></div><div class="sec-hdr">◆ 关于</div><div class="about-section">AI Companion v1.0 • 基于 OpenRouter API • 由 Codex 建造</div></div></div><div class="overlay" id="overlay" onclick="closePanel()"></div><div class="panel" id="memories-panel"><div class="panel-header"><h3>&#x8BB0;&#x5FC6;</h3><div><button onclick="clearMemories()" style="background:none;border:none;color:#e74c3c;font-size:12px;cursor:pointer;margin-right:8px">&#x6E05;&#x9664;</button><button class="close" onclick="closePanel()">&#10005;</button></div></div><div class="panel-body" id="memories-list"></div></div><script>
var BACKEND = '';
var loading = false;

async function send() {
    var input = document.getElementById('input');
    var text = input.value.trim();
    if (!text || loading) return;
    input.value = '';
    input.style.height = 'auto';
    loading = true;
    document.getElementById('send-btn').disabled = true;
    addMsg('user', text);
    addTyping();
    try {
        var res = await fetch(BACKEND + '/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text, model: document.getElementById('model-select').value, temperature: parseFloat(document.getElementById('slider-temperature').value), topP: parseFloat(document.getElementById('slider-topp').value), maxTokens: parseInt(document.getElementById('slider-maxtokens').value) })
        });
        if (!res.ok) throw new Error(await res.text());
        var data = await res.json();
        removeTyping();
        var reply = data.reply || '';
        var thinkText = data.thinking || '';
        var usage = data.usage || null;
        if (thinkText) addThink(thinkText, true);
        if (reply) addMsg('assistant', reply);
        if (usage) updateTokenBar(usage);
    } catch (err) {
        removeTyping();
        addMsg('assistant', 'Error: ' + err.message);
    }
    loading = false;
    document.getElementById('send-btn').disabled = false;
}

function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
}

function escapeHtml(t) {
    return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function formatMsg(content) {
    var s = escapeHtml(content);
    // Code blocks
    s = s.replace(/&#x60;&#x60;&#x60;(\n|.)*?&#x60;&#x60;&#x60;/g, function(m) {
        var code = m.replace(/&#x60;&#x60;&#x60;/, '').replace(/&#x60;&#x60;&#x60;$/, '');
        return '<pre>' + code + '</pre>';
    });
    // Inline code
    s = s.replace(/&#x60;([^&#x60;]+)&#x60;/g, '<code>$1</code>');
    // Newlines
    s = s.replace(/\n/g, '<br>');
    return s;
}

function addMsg(role, content) {
    var chat = document.getElementById('chat');
    var row = document.createElement('div');
    row.className = 'msg-row ' + role;
    var avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? (localStorage.getItem('userAvatar') || 'U') : (localStorage.getItem('aiAvatar') || 'AI');
    if(avatar.textContent.indexOf('data:')===0||avatar.textContent.indexOf('http')===0){avatar.className+=' img';avatar.style.backgroundImage='url('+avatar.textContent+')';avatar.textContent='';}
    var bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    var time = new Date().toLocaleTimeString('zh-CN', { hour:'2-digit', minute:'2-digit' });
    bubble.innerHTML = formatMsg(content) + '<span class="time">' + time + '</span>';
    if (role === 'user') { row.appendChild(bubble); row.appendChild(avatar); }
    else { row.appendChild(avatar); row.appendChild(bubble); }
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
    removeWelcome();
}

function addThink(text, autoFold) {
    var chat = document.getElementById('chat');
    var row = document.createElement('div');
    row.className = 'think-row';
    row.innerHTML = '<div class="indent"></div><details class="think-bubble"><summary>&#x601D;&#x8003;</summary><div class="think-content">' + text + '</div></details>';
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
}

function addTyping() {
    var chat = document.getElementById('chat');
    var row = document.createElement('div');
    row.id = 'typing-indicator';
    row.className = 'msg-row assistant';
    var avatar = document.createElement('div'); avatar.className = 'avatar'; var avText=localStorage.getItem('aiAvatar')||'AI';avatar.textContent=avText;if(avText.indexOf('data:')===0||avText.indexOf('http')===0){avatar.className+=' img';avatar.style.backgroundImage='url('+avText+')';avatar.textContent='';}
    var bubble = document.createElement('div'); bubble.className = 'msg-bubble';
    bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    row.appendChild(avatar); row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
}

function removeTyping() { var el = document.getElementById('typing-indicator'); if (el) el.remove(); }
function removeWelcome() { var w = document.querySelector('.welcome'); if (w && document.querySelectorAll('.msg-row').length > 0) w.remove(); }

function togglePanel(name) {
    var p = document.getElementById(name + '-panel');
    var o = document.getElementById('overlay');
    var isOpen = p.classList.contains('open');
    p.classList.toggle('open'); o.classList.toggle('open');
    if (!isOpen && name === 'memories') loadMemories();
}
function toggleTheme(){var t=document.documentElement.getAttribute("data-theme");var n=t==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",n);localStorage.setItem("theme",n);document.getElementById("theme-btn").textContent=n==="dark"?"\u2602":"\u2600";var sel=document.getElementById("theme-select");if(sel)sel.value=n}function closePanel() { document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('open');}); document.getElementById('overlay').classList.remove('open'); }

async function loadMemories() {
    try {
        var res = await fetch(BACKEND + '/api/memories');
        var data = await res.json();
        var list = document.getElementById('memories-list');
        if (!data || !data.length) { list.innerHTML = '<div style="color:var(--text3);font-size:13px;text-align:center;padding:20px">&#x6682;&#x65E0;&#x8BB0;&#x5FC6;</div>'; return; }
        list.innerHTML = data.map(function(m) { return '<div class="item"><div class="label">' + new Date(m.timestamp).toLocaleString() + '</div>' + (m.content||'') + '</div>'; }).join('');
    } catch(e) { document.getElementById('memories-list').innerHTML = '<div style="color:red;font-size:13px">&#x52A0;&#x8F7D;&#x5931;&#x8D25;</div>'; }
}

async function clearMemories() {
    if (!confirm('&#x786E;&#x5B9A;&#x6E05;&#x9664;&#x6240;&#x6709;&#x8BB0;&#x5FC6;&#x548C;&#x5BF9;&#x8BDD;&#xFF1F;')) return;
    try {
        await fetch(BACKEND + '/api/memories', { method:'DELETE' });
        document.getElementById('chat').innerHTML = '<div class="welcome"><div class="title">&#x5DF2;&#x6E05;&#x9664;</div></div>';
        document.getElementById('memories-list').innerHTML = '<div style="color:var(--text3);font-size:13px;text-align:center;padding:20px">Cleared</div>';
    } catch(e) { alert('Failed to clear'); }
}


function handleUpload(key,input){var file=input.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(e){var url=e.target.result;localStorage.setItem(key,url);var role=key.replace('userAvatar','user').replace('aiAvatar','assistant');document.querySelectorAll('.msg-row.'+role+' .avatar').forEach(function(a){a.style.backgroundImage='url('+url+')';a.style.backgroundSize='cover';a.className='avatar img';a.textContent='';});};reader.readAsDataURL(file);}
function initAvatars(){var avatars=['userAvatar','aiAvatar'];var defaults=['U','AI'];avatars.forEach(function(key,i){var saved=localStorage.getItem(key)||defaults[i];if(saved.indexOf('data:')===0||saved.indexOf('http')===0)return;document.querySelectorAll('#av-pick-'+key+' .av-opt').forEach(function(e){if(e.textContent===saved)e.classList.add('active');});});}
function pickAvatar(key,el){document.querySelectorAll('#av-pick-'+key+' .av-opt').forEach(function(e){e.classList.remove('active');});el.classList.add('active');localStorage.setItem(key,el.textContent);document.querySelectorAll('.msg-row.'+key.replace('userAvatar','user').replace('aiAvatar','assistant')+' .avatar').forEach(function(a){a.style.backgroundImage='';a.className='avatar';a.textContent=el.textContent;});}
async function loadSettingsFromBackend() {
    try {
        var res = await fetch(BACKEND + '/api/settings');
        if (!res.ok) return;
        var s = await res.json();
        if (s.temperature != null) { document.getElementById('slider-temperature').value = s.temperature; document.getElementById('val-temperature').textContent = s.temperature; }
        if (s.topP != null) { document.getElementById('slider-topp').value = s.topP; document.getElementById('val-topp').textContent = s.topP; }
        if (s.maxTokens != null) { document.getElementById('slider-maxtokens').value = s.maxTokens; document.getElementById('val-maxtokens').textContent = s.maxTokens; }
        if (s.systemPrompt) { document.getElementById('system-prompt-editor').value = s.systemPrompt; }
    } catch(e) {}
}
function updateSliderValue(el) {
    var val = el.value;
    var label = document.getElementById('val-' + el.id.replace('slider-', ''));
    if (label) label.textContent = val;
    // Auto-save
    var t = document.getElementById('slider-temperature').value;
    var p = document.getElementById('slider-topp').value;
    var m = document.getElementById('slider-maxtokens').value;
    fetch(BACKEND + '/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ temperature: parseFloat(t), topP: parseFloat(p), maxTokens: parseInt(m) }) }).catch(function(){});
}
async function saveSystemPrompt() {
    var text = document.getElementById('system-prompt-editor').value;
    var res = await fetch(BACKEND + '/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ systemPrompt: text }) });
    if (res.ok) alert('已保存');
}
async function resetSystemPrompt() {
    document.getElementById('system-prompt-editor').value = '';
    await fetch(BACKEND + '/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ systemPrompt: '' }) });
    alert('已恢复默认');
}

function updateTokenBar(usage) {
    var bar = document.getElementById('token-bar');
    if (bar && usage) {
        var p = usage.prompt_tokens || 0;
        var c = usage.completion_tokens || 0;
        var t = usage.total_tokens || (p + c);
        bar.innerHTML = p + ' in / ' + c + ' out / ' + t + ' total';
    }
}
async function loadHistory() {
    try {
        var res = await fetch(BACKEND + '/api/history');
        if (!res.ok) return;
        var history = await res.json();
        if (!history || !history.length) return;
        var cnt = document.querySelectorAll(".msg-row").length;
        for (var i = cnt; i < history.length; i++) {
            var msg = history[i];
            if (msg.role === 'user') addMsg('user', msg.content);
            else if (msg.role === 'assistant') addMsg('assistant', msg.content);
        }
    } catch(e) {}
}
function toggleSettings() {
    togglePanel('settings');
    if (document.getElementById('settings-panel').classList.contains('open')) {
        var curTheme = document.documentElement.getAttribute('data-theme') || 'light';
        document.getElementById('theme-select').value = curTheme;
        var mainSelect = document.getElementById('model-select');
        var settingsSelect = document.getElementById('settings-model-select');
        settingsSelect.innerHTML = mainSelect.innerHTML;
        settingsSelect.value = mainSelect.value;
        loadSettingsFromBackend();
                initAvatars();
    }
}

    document.documentElement.setAttribute('data-theme', val);

    document.getElementById('theme-btn').textContent = val === 'dark' ? '\u2602' : '\u2600';
}
function modelSelectChange(val) { document.getElementById('model-select').value = val; }
function thinkModeChange(val) { localStorage.setItem('thinkMode', val); }
function clearAllData() {
    if (!confirm('\u786e\u5b9a\u6e05\u7a7a\u6240\u6709\u8bb0\u5fc6\u548c\u5bf9\u8bdd\uff1f')) return;

    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 100) + 'px';
});

loadHistory();
if('serviceWorker'in navigator){navigator.serviceWorker.register('/service-worker.js');}
