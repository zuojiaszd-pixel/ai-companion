/* Token display */
/* Scroll to bottom button */
#scroll-bottom-btn{position:fixed;bottom:64px;right:16px;width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);cursor:pointer;display:none;align-items:center;justify-content:center;font-size:18px;color:var(--accent);z-index:50;transition:all .2s;opacity:0;transform:scale(0.8)}
#scroll-bottom-btn.show{display:flex;opacity:1;transform:scale(1)}
#scroll-bottom-btn:hover{background:var(--surface2);transform:scale(1.1)}
#token-bar{position:fixed;bottom:56px;right:0;padding:4px 12px;font-size:10px;color:var(--text3);z-index:999;pointer-events:none;user-select:none;background:var(--surface);border-top-left-radius:6px;border:1px solid var(--border);border-right:none}
/* Settings panel */
#settings-panel .setting-item{padding:10px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-size:13px}
#settings-panel .setting-item:last-child{border-bottom:none}
#settings-panel .setting-item select{padding:4px 24px 4px 8px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12px;cursor:pointer;outline:none;-webkit-appearance:none;appearance:none}
#settings-panel .btn-danger{padding:6px 16px;border:none;border-radius:6px;background:#e74c3c;color:#fff;font-size:12px;cursor:pointer}
#settings-panel .btn-danger:hover{opacity:.85}

/* Settings textarea */
#settings-panel .setting-textarea{width:100%;min-height:120px;padding:8px;border:1px solid var(--border);border-radius:6px;background:var(--surface2);color:var(--text);font-size:12px;font-family:monospace;resize:vertical;outline:none;box-sizing:border-box}
#settings-panel .setting-textarea:focus{border-color:var(--accent)}
/* Slider row */
#settings-panel .slider-row{display:flex;align-items:center;gap:10px;padding:6px 0}
#settings-panel .slider-row input[type=range]{flex:1;height:4px;-webkit-appearance:none;appearance:none;background:var(--border);border-radius:2px;outline:none;cursor:pointer}
#settings-panel .slider-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;border:none}
#settings-panel .slider-value{width:50px;text-align:right;font-size:12px;color:var(--text2);font-family:monospace}
/* About section */
#settings-panel .about-section{padding:12px 0;font-size:12px;color:var(--text3);line-height:1.8;text-align:center;border-top:1px solid var(--border);margin-top:8px}
#settings-panel .about-section a{color:var(--accent);text-decoration:none}
/* Uploaded image */
.avatar.img{background-size:contain;background-position:center;background-repeat:no-repeat;font-size:0;overflow:hidden}
.av-upload-row{display:flex;gap:8px;padding:4px 0}
.av-upload-row .btn-upload{padding:5px 12px;border:none;border-radius:6px;background:var(--accent);color:#fff;font-size:11px;cursor:pointer;display:flex;align-items:center;gap:4px}
.av-upload-row .btn-upload:hover{opacity:.85}
/* Avatar */
.av-pick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:6px 0 10px}
.av-pick .av-opt{width:36px;height:36px;border-radius:50%;border:2px solid var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:all .15s;margin:auto}
.av-pick .av-opt:hover{border-color:var(--accent);transform:scale(1.12)}
.av-pick .av-opt.active{border-color:var(--accent);background:var(--accent);color:#fff;box-shadow:0 0 12px rgba(124,92,255,.4)}
#settings-panel .sec-hdr{padding:10px 0 4px;font-size:11px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:6px;letter-spacing:1px;text-transform:uppercase}
#settings-panel .panel-header{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:var(--radius) var(--radius) 0 0}
#settings-panel .panel-body{padding:12px 16px 16px}

.msg-bubble h1,.msg-bubble h2,.msg-bubble h3,.msg-bubble h4,.msg-bubble h5,.msg-bubble h6{margin:8px 0 4px;font-weight:600;line-height:1.3}
.msg-bubble h1{font-size:18px}.msg-bubble h2{font-size:16px}.msg-bubble h3{font-size:15px}.msg-bubble h4{font-size:14px}
.msg-bubble ul,.msg-bubble ol{margin:6px 0;padding-left:20px}
.msg-bubble li{margin:2px 0}
.msg-bubble blockquote{margin:6px 0;padding:4px 12px;border-left:3px solid var(--accent);color:var(--text2);background:var(--surface2);border-radius:0 6px 6px 0}
.msg-bubble a{color:var(--accent);text-decoration:none;border-bottom:1px dashed var(--accent)}
.msg-bubble a:hover{opacity:.8}
.msg-bubble table{margin:8px 0;border-collapse:collapse;width:100%;font-size:13px}
.msg-bubble th,.msg-bubble td{border:1px solid var(--border);padding:4px 8px;text-align:left}
.msg-bubble th{background:var(--surface2);font-weight:600}
.msg-bubble hr{border:none;border-top:1px solid var(--border);margin:10px 0}
.msg-bubble p{margin:4px 0}
.msg-bubble strong{font-weight:700}
.msg-bubble em{font-style:italic}
.msg-bubble del{text-decoration:line-through;color:var(--text3)}
.msg-bubble img{max-width:100%;border-radius:8px;margin:4px 0}
.msg-bubble pre{margin:8px 0;padding:12px;border-radius:var(--radius-sm);background:#0a0a14;overflow-x:auto;font-size:13px;line-height:1.5;font-family:'SF Mono',Menlo,Consolas,monospace}
.msg-bubble pre code{background:none;padding:0;color:#e0e0e0;font-size:13px}
.msg-bubble code{font-size:13px;background:rgba(0,0,0,.12);padding:1px 6px;border-radius:4px;font-family:'SF Mono',Menlo,Consolas,monospace}
[data-theme="dark"] .msg-bubble code{background:rgba(255,255,255,.1)}
/* Code syntax highlighting */
.msg-bubble pre code.hljs{padding:0;background:none}
.msg-bubble pre{background:#0d1117 !important}

#img-btn:hover{color:var(--accent);transform:scale(1.1)}
#img-btn:active{transform:scale(.95)}

/* Bottom Navigation Bar */
#bottom-nav{display:flex;justify-content:space-around;align-items:center;padding:6px 0 8px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;z-index:10}
[data-theme="dark"] #bottom-nav{background:rgba(26,20,23,.9)}
.nav-tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 16px;border:none;background:none;color:var(--text3);cursor:pointer;font-size:11px;border-radius:var(--radius-sm);transition:all .15s;position:relative}
.nav-tab:hover{color:var(--text2)}
.nav-tab.active{color:var(--accent)}
.nav-tab .nav-icon{display:flex;align-items:center;justify-content:center}.nav-tab .nav-icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-tab .nav-label{font-size:10px;white-space:nowrap}

/* Page system */
.page{display:none;flex:1;flex-direction:column;overflow:hidden;min-height:0}
.page.active{display:flex}

/* Calendar Page */
#page-calendar{padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cal-header .cal-title{font-size:18px;font-weight:600;color:var(--text)}
.cal-header .cal-nav-btn{width:36px;height:36px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text2);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.cal-header .cal-nav-btn:hover{background:var(--surface2);color:var(--accent);border-color:var(--accent)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-weekday{text-align:center;font-size:11px;color:var(--text3);padding:4px 0;font-weight:600}
.cal-day{aspect-ratio:1;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;position:relative;font-size:14px;color:var(--text)}
.cal-day:hover{background:var(--surface2);border-color:var(--accent)}
.cal-day.other-month{color:var(--text3);opacity:.4}
.cal-day.today{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.cal-day.today:hover{background:var(--accent-dark)}
.cal-day.selected{border-color:var(--accent);border-width:2px}
.cal-day .cal-dot{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.cal-day.today .cal-dot{background:#fff}
.cal-day .cal-dots{position:absolute;bottom:3px;display:flex;gap:2px}

/* Calendar events panel */
.cal-events{margin-top:20px}
.cal-events h4{font-size:14px;font-weight:600;margin-bottom:10px;color:var(--text)}
.cal-event-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;animation:fadeIn .2s ease-out}
.cal-event-item .cal-event-color{width:4px;height:24px;border-radius:2px;flex-shrink:0}
.cal-event-item .cal-event-text{flex:1;font-size:13px;color:var(--text)}
.cal-event-item .cal-event-del{width:24px;height:24px;border:none;border-radius:50%;background:var(--surface2);color:var(--text3);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.cal-event-item .cal-event-del:hover{background:#e74c3c;color:#fff}
.cal-add-row{display:flex;gap:8px;margin-top:12px}
.cal-add-row input{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-size:13px;outline:none;font-family:var(--font)}
.cal-add-row input:focus{border-color:var(--accent)}
.cal-add-row button{padding:8px 16px;border:none;border-radius:var(--radius-sm);background:var(--accent);color:#fff;font-size:13px;cursor:pointer;transition:all .15s;white-space:nowrap}
.cal-add-row button:hover{opacity:.85}
.cal-empty{text-align:center;color:var(--text3);font-size:13px;padding:20px}
@media(max-width:600px){
  .nav-tab{padding:4px 10px}
  .nav-tab .nav-icon svg{width:18px;height:18px}
  .nav-tab .nav-label{font-size:9px}
  #page-calendar{padding:10px}
  .cal-day{font-size:12px}
  .cal-weekday{font-size:10px}
  .cal-header .cal-title{font-size:16px}
  #scroll-bottom-btn{bottom:56px}
  #token-bar{bottom:60px}
}

/* Memory Page */
#page-memory{padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.mem-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.mem-header .mem-title{font-size:18px;font-weight:600;color:var(--text)}
.mem-header .mem-count{font-size:12px;color:var(--text3);background:var(--surface);border:1px solid var(--border);padding:4px 12px;border-radius:var(--radius-sm)}
.mem-filter{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.mem-filter-btn{padding:4px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text2);font-size:12px;cursor:pointer;transition:all .15s}
.mem-filter-btn:hover{border-color:var(--accent);color:var(--accent)}
.mem-filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.mem-list{display:flex;flex-direction:column;gap:8px}
.mem-item{padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);transition:all .15s;animation:fadeIn .2s ease-out}
.mem-item:hover{border-color:var(--accent)}
.mem-item .mem-item-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.mem-item .mem-type{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.mem-item .mem-type.fact{background:rgba(245,160,184,.15);color:var(--accent)}
.mem-item .mem-type.preference{background:rgba(100,180,255,.15);color:#64b4ff}
.mem-item .mem-type.experience{background:rgba(100,200,150,.15);color:#64c896}
.mem-item .mem-type.summary{background:rgba(180,140,255,.15);color:#b48cff}

(this)"><span class="slider-value" id="val-maxtokens">16000</span></div></div><div class="sec-hdr">◆ 显示</div><div class="setting-item"><span>主题模式</span><select id="theme-select" onchange="themeSelectChange(this.value)"><option value="light">浅色</option><option value="dark">深色</option></select></div><div class="setting-item"><span>思考链显示</span><select id="think-mode" onchange="thinkModeChange(this.value)"><option value="auto">自动折叠</option><option value="show">始终展开</option><option value="hide">始终隐藏</option></select></div><div class="setting-item"><span>记忆管理</span><button class="btn-danger" onclick="clearAllData()">清空记忆和对话</button></div><div class="sec-hdr">◆ 关于</div><div class="about-section">Lumi v1.0 • 由 💖 建造</div></div></div><div class="overlay" id="overlay" onclick="closePanel()"></div></div><script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js">
// === Task Page ===
var taskAllData = [];
var taskCurrentFilter = 'all';

async function taskLoad() {
    try {
        var res = await fetch(BACKEND + '/api/tasks');
        var data = await res.json();
        taskAllData = data || [];
        taskRender();
    } catch(e) {
        document.getElementById('task-list').innerHTML = '<div class="task-empty">加载失败</div>';
    }
}

function taskFilter(type, btn) {
    taskCurrentFilter = type;
    document.querySelectorAll('.task-filter-btn').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
    taskRender();
}

function taskRender() {
    var list = document.getElementById('task-list');
    var filtered = taskAllData;
    if (taskCurrentFilter === 'pending') filtered = taskAllData.filter(function(t){return !t.completed;});
    else if (taskCurrentFilter === 'completed') filtered = taskAllData.filter(function(t){return t.completed;});
    var pendingCount = taskAllData.filter(function(t){return !t.completed;}).length;
    document.getElementById('task-count').textContent = pendingCount + ' 项待办';
    if (!filtered.length) {
        list.innerHTML = '<div class="task-empty">' + (taskCurrentFilter === 'completed' ? '还没有完成的任务' : '暂无任务，添加一个吧') + '</div>';
        return;
    }
    var priorityLabels = {high:'高', medium:'中', low:'低'};
    var creatorLabels = {user:'我', ai:'Lumi'};
    list.innerHTML = filtered.map(function(t) {
        var priority = t.priority || 'medium';
        var creator = t.createdBy || 'user';
        var dueDate = t.dueDate ? '<span class="task-due">📅 '+escapeHtml(t.dueDate)+'</span>' : '';
        return '<div class="task-item'+(t.completed?' completed':'')+'">' +
            '<div class="task-checkbox'+(t.completed?' checked':'')+'" onclick="taskToggle(\''+t._id+'\')">'+(t.completed?'✓':'')+'</div>' +
            '<div class="task-content">' +
            '<div class="task-text">'+escapeHtml(t.title||'')+'</div>' +
            '<div class="task-meta">' +
            '<span class="task-priority '+priority+'">'+priorityLabels[priority]+'</span>' +
            '<span class="task-creator">'+creatorLabels[creator]+'</span>' +
            dueDate +
            '</div>' +
            '</div>' +
            '<button class="task-del" onclick="taskDelete(\''+t._id+'\')">&times;</button>' +
            '</div>';
    }).join('');
}

async function taskAdd() {
    var input = document.getElementById('task-input');
    var title = input.value.trim();
    if (!title) return;
    var priority = document.getElementById('task-priority-select').value;
    input.value = '';
    try {
        var res = await fetch(BACKEND + '/api/tasks', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: title, priority: priority, createdBy: 'user' })
        });
        if (!res.ok) throw new Error(await res.text());
        var task = await res.json();
        taskAllData.unshift(task);
        taskRender();
    } catch(e) { alert('添加失败: ' + e.message); }
}

async function taskToggle(id) {
    try {
        var res = await fetch(BACKEND + '/api/tasks/' + id + '/toggle', { method: 'PATCH' });
        if (!res.ok) throw new Error(await res.text());
        var updated = await res.json();
        var idx = taskAllData.findIndex(function(t){return t._id === id;});
        if (idx >= 0) {
            taskAllData[idx].completed = updated.completed;
            taskAllData[idx].completedAt = updated.completedAt;
        }
        taskRender();
    } catch(e) { alert('操作失败'); }
}

async function taskDelete(id) {
    if (!confirm('删除这个任务？')) return;
    try {
        await fetch(BACKEND + '/api/tasks/' + id, { method: 'DELETE' });
        taskAllData = taskAllData.filter(function(t){return t._id !== id;});
        taskRender();
    } catch(e) { alert('删除失败'); }
}

    taskCurrentFilter = type;
    document.querySelectorAll('.task-filter-btn').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
    taskRender();
}

function taskRender() {
    var list = document.getElementById('task-list');
    var filtered = taskAllData;
    if (taskCurrentFilter === 'pending') filtered = taskAllData.filter(function(t){return !t.completed;});
    else if (taskCurrentFilter === 'completed') filtered = taskAllData.filter(function(t){return t.completed;});
    var pendingCount = taskAllData.filter(function(t){return !t.completed;}).length;
    document.getElementById('task-count').textContent = pendingCount + ' 项待办';
    if (!filtered.length) {
        list.innerHTML = '<div class="task-empty">' + (taskCurrentFilter === 'completed' ? '还没有完成的任务' : '暂无任务，添加一个吧') + '</div>';
        return;
    }
    var priorityLabels = {high:'高', medium:'中', low:'低'};
    var creatorLabels = {user:'我', ai:'Lumi'};
    list.innerHTML = filtered.map(function(t) {
        var priority = t.priority || 'medium';
        var creator = t.createdBy || 'user';
        var dueDate = t.dueDate ? '<span class="task-due">📅 '+escapeHtml(t.dueDate)+'</span>' : '';
        return '<div class="task-item'+(t.completed?' completed':'')+'">' +
            '<div class="task-checkbox'+(t.completed?' checked':'')+'" onclick="taskToggle(\''+t._id+'\')">'+(t.completed?'✓':'')+'</div>' +
            '<div class="task-content">' +
            '<div class="task-text">'+escapeHtml(t.title||'')+'</div>' +
            '<div class="task-meta">' +
            '<span class="task-priority '+priority+'">'+priorityLabels[priority]+'</span>' +
            '<span class="task-creator">'+creatorLabels[creator]+'</span>' +
            dueDate +
            '</div>' +
            '</div>' +
            '<button class="task-del" onclick="taskDelete(\''+t._id+'\')">&times;</button>' +
            '</div>';
    }).join('');
}

async function taskAdd() {
    var input = document.getElementById('task-input');
    var title = input.value.trim();
    if (!title) return;
    var priority = document.getElementById('task-priority-select').value;
    input.value = '';
    try {
        var res = await fetch(BACKEND + '/api/tasks', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: title, priority: priority, createdBy: 'user' })
        });
        if (!res.ok) throw new Error(await res.text());
        var task = await res.json();
        taskAllData.unshift(task);
        taskRender();
    } catch(e) { alert('添加失败: ' + e.message); }
}

async function taskToggle(id) {
    try {
        var res = await fetch(BACKEND + '/api/tasks/' + id + '/toggle', { method: 'PATCH' });
        if (!res.ok) throw new Error(await res.text());
        var updated = await res.json();
        var idx = taskAllData.findIndex(function(t){return t._id === id;});
        if (idx >= 0) {
            taskAllData[idx].completed = updated.completed;
            taskAllData[idx].completedAt = updated.completedAt;
        }
        taskRender();
    } catch(e) { alert('操作失败'); }
}

async function taskDelete(id) {
    if (!confirm('删除这个任务？')) return;
    try {
        await fetch(BACKEND + '/api/tasks/' + id, { method: 'DELETE' });
        taskAllData = taskAllData.filter(function(t){return t._id !== id;});
        taskRender();
    } catch(e) { alert('删除失败'); }
}

<script>
var BACKEND = '';
var loading = false;
var pendingRequest = false;

var pendingImage = null;

function handleImageSelect(input) {
    var file = input.files[0];
    if (!file) return;
    if (file.size > 4 * 1024 * 1024) { alert('图片不能超过4MB哦'); input.value = ''; return; }
    var reader = new FileReader();
    reader.onload = function(e) {
        // Compress image
        var img = new Image();
        img.onload = function() {
            var c = document.createElement('canvas');
            var max = 1024;
            var r = Math.min(max / img.width, max / img.height, 1);
            c.width = Math.round(img.width * r);
            c.height = Math.round(img.height * r);
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            pendingImage = c.toDataURL('image/jpeg', 0.8);
            var preview = document.getElementById('img-preview');
            preview.src = pendingImage;
            document.getElementById('img-preview-wrap').style.display = 'flex';
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

function clearImageSelect() {
    pendingImage = null;
    document.getElementById('img-preview-wrap').style.display = 'none';
    document.getElementById('file-image').value = '';
}

async function send() {
    var input = document.getElementById('input');
    var text = input.value.trim();
    var imageData = pendingImage;
    if (!text && !imageData) return;
    if (loading || pendingRequest) return;
    pendingRequest = true;
    input.value = '';
    input.style.height = 'auto';
    loading = true;
    document.getElementById('send-btn').disabled = true;
    var ldTimer = setTimeout(function(){if(loading){loading=false;document.getElementById('send-btn').disabled=false;}},120000);
    try {
        if (imageData) { addMsgWithImage('user', text, imageData); clearImageSelect(); }
        else addMsg('user', text);
        addTyping();
        var res = await fetch(BACKEND + '/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text, image: imageData, model: document.getElementById('model-select').value, temperature: parseFloat(document.getElementById('slider-temperature').value), topP: parseFloat(document.getElementById('slider-topp').value), maxTokens: parseInt(document.getElementById('slider-maxtokens').value) })
        });
        if (!res.ok) throw new Error(await res.text());
        var data = await res.json();
        removeTyping();
        var reply = data.reply || '';
        var thinkText = data.thinking || '';
        var usage = data.usage || null;
        if (thinkText) addThink(thinkText, true);
        if (reply) addMsg('assistant', reply);
        if (usage) updateTokenBar(usage);
    } catch (err) {
        removeTyping();
        addMsg('assistant', '服务器好像在打盹…消息应该已经收到了，等几秒刷新一下就能看到回复');
    } finally {
        clearTimeout(ldTimer);
        loading = false;
        pendingRequest = false;
        document.getElementById('send-btn').disabled = false;
    }
}

function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
}


function playNotifySound() {
    try {
        var ctx = new (window.AudioContext || window.webkitAudioContext)();
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(660, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.15, ctx.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.3);
    } catch(e) {}
}

function escapeHtml(t) {
    return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function formatMsg(content) {
    if (typeof marked !== 'undefined') {
        try {
            marked.setOptions({ breaks: true, gfm: true,
                highlight: function(code, lang) {
                    if (typeof hljs !== 'undefined' && lang && hljs.getLanguage(lang)) {
                        try { return hljs.highlight(code, { language: lang }).value; } catch(e) {}
                    }
                    if (typeof hljs !== 'undefined') {
                        try { return hljs.highlightAuto(code).value; } catch(e) {}
                    }
                    return code;
                }
            });
            var result = marked.parse(content);
            return result;
        } catch(e) {}
    }
    // Fallback: basic formatting
    var s = escapeHtml(content);
    s = s.replace(/```(\n|.)*?```/g, function(m) {
        var code = m.replace(/```/, '').replace(/```$/, '');
        return '<pre>' + code + '</pre>';
    });
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\n/g, '<br>');
    return s;
}

function addMsg(role, content) {
    if (role === 'assistant' && content.indexOf('|') !== -1) {
        var parts = content.split('|');
        for (var i = 0; i < parts.length; i++) {
            var part = parts[i].trim();
            if (part) addMsg(role, part);
        }
        return;
    }
    var chat = document.getElementById('chat');
    var row = document.createElement('div');
    row.className = 'msg-row ' + role;
    var avatar = document.createElement('div');
    avatar.className = 'avatar';

    if(avatar.textContent.indexOf('data:')===0||avatar.textContent.indexOf('http')===0){avatar.className+=' img';avatar.style.backgroundImage='url('+avatar.textContent+')';avatar.textContent='';}
    var bubble = document.createElement('div');
    if (role === 'user') bubble.style.marginLeft = 'auto';
    bubble.className = 'msg-bubble';
    var time = new Date().toLocaleTimeString('zh-CN', { hour:'2-digit', minute:'2-digit' });
    bubble.innerHTML = formatMsg(content) + '<span class="time">' + time + '</span>';
    if (role === 'user') { row.appendChild(bubble); row.appendChild(avatar); }
    else { playNotifySound(); row.appendChild(avatar); row.appendChild(bubble); }
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
    removeWelcome();
}

}

function calFmtMonth(d) {
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}

async function calLoadEvents() {
    try {
        var month = calFmtMonth(calCurrentDate);
        var res = await fetch(BACKEND + '/api/calendar?month=' + month);
        if (!res.ok) return;
        var events = await res.json();
        calEvents = {};
        events.forEach(function(e) {
            if (!calEvents[e.date]) calEvents[e.date] = [];
            calEvents[e.date].push(e);
        });
    } catch(e) { console.error('Calendar load error:', e); }
}

function calRender() {
    var year = calCurrentDate.getFullYear();
    var month = calCurrentDate.getMonth();
    var monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
    document.getElementById('cal-title').textContent = year + '年 ' + monthNames[month];
    
    var firstDay = new Date(year, month, 1);
    var lastDay = new Date(year, month + 1, 0);
    var startWeekday = firstDay.getDay();
    var daysInMonth = lastDay.getDate();
    var prevMonthDays = new Date(year, month, 0).getDate();
    
    var grid = document.getElementById('cal-grid');
    var html = '';
    var weekdays = ['日','一','二','三','四','五','六'];
    weekdays.forEach(function(w) { html += '<div class="cal-weekday">' + w + '</div>'; });
    
    // Previous month days
    for (var i = startWeekday - 1; i >= 0; i--) {
        html += '<div class="cal-day other-month">' + (prevMonthDays - i) + '</div>';
    }
    
    // Current month days
    var today = new Date();
    var todayStr = calFmtDate(today);
    for (var d = 1; d <= daysInMonth; d++) {
        var dateStr = year + '-' + String(month+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
        var classes = 'cal-day';
        if (dateStr === todayStr) classes += ' today';
        if (calSelectedDate === dateStr) classes += ' selected';
        var dots = '';
        if (calEvents[dateStr] && calEvents[dateStr].length > 0) {
            var colors = calEvents[dateStr].map(function(e){return e.color||'#f5a0b8';}).slice(0,3);
            dots = '<div class="cal-dots">' + colors.map(function(c){return '<div class="cal-dot" style="background:'+c+'"></div>';}).join('') + '</div>';
        }
        html += '<div class="' + classes + '" onclick="calSelectDate(\'' + dateStr + '\')">' + d + dots + '</div>';
    }
    
    // Next month days to fill the grid
    var totalCells = startWeekday + daysInMonth;
    var remaining = (7 - (totalCells % 7)) % 7;
    for (var d = 1; d <= remaining; d++) {
        html += '<div class="cal-day other-month">' + d + '</div>';
    }
    
    grid.innerHTML = html;
    calRenderEvents();
}

function calSelectDate(dateStr) {
    calSelectedDate = dateStr;
    calRender();
    document.getElementById('cal-event-input').focus();
}

function calRenderEvents() {
    var list = document.getElementById('cal-event-list');
    var titleEl = document.getElementById('cal-selected-date');
    if (!calSelectedDate) {
        titleEl.textContent = '点击日期查看事件';
        list.innerHTML = '<div class="cal-empty">选择一个日期来添加事件</div>';
        return;
    }
    var parts = calSelectedDate.split('-');
    titleEl.textContent = parts[1] + '月' + parseInt(parts[2]) + '日的事件';
    var events = calEvents[calSelectedDate] || [];
    if (events.length === 0) {
        list.innerHTML = '<div class="cal-empty">暂无事件</div>';
    } else {
        list.innerHTML = events.map(function(e) {
            return '<div class="cal-event-item"><div class="cal-event-color" style="background:' + (e.color||'#f5a0b8') + '"></div><div class="cal-event-text">' + escapeHtml(e.title) + '</div><button class="cal-event-del" onclick="calDeleteEvent(\'' + e._id + '\')">&times;</button></div>';
        }).join('');
    }
}

async function calAddEvent() {
    var input = document.getElementById('cal-event-input');
    var title = input.value.trim();
    if (!title || !calSelectedDate) return;
    input.value = '';
    try {
        var res = await fetch(BACKEND + '/api/calendar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ date: calSelectedDate, title: title })
        });
        if (!res.ok) throw new Error(await res.text());
        var event = await res.json();
        if (!calEvents[calSelectedDate]) calEvents[calSelectedDate] = [];
        calEvents[calSelectedDate].push(event);
        calRender();
    } catch(e) { alert('添加失败: ' + e.message); }
}

async function calDeleteEvent(id) {
    try {
        await fetch(BACKEND + '/api/calendar/' + id, { method: 'DELETE' });
        if (calSelectedDate && calEvents[calSelectedDate]) {
            calEvents[calSelectedDate] = calEvents[calSelectedDate].filter(function(e){return e._id !== id;});
        }
        calRender();
    } catch(e) { alert('删除失败: ' + e.message); }
}

function calPrevMonth() {
    calCurrentDate.setMonth(calCurrentDate.getMonth() - 1);
    calLoadEvents().then(function(){ calRender(); });
}

function calNextMonth() {
    calCurrentDate.setMonth(calCurrentDate.getMonth() + 1);
    calLoadEvents().then(function(){ calRender(); });
}

// Init calendar
calLoadEvents().then(function(){ calRender(); });


// === Memory Page ===
var memAllData = [];
var memCurrentFilter = 'all';

async function memLoad() {
    try {
        var res = await fetch(BACKEND + '/api/memories');
        var data = await res.json();
        memAllData = data || [];
        memRender();
    } catch(e) {
        document.getElementById('mem-page-list').innerHTML = '<div class="mem-empty">加载失败</div>';
    }
}

function memFilter(type, btn) {
    memCurrentFilter = type;
    document.querySelectorAll('.mem-filter-btn').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
    memRender();
}

function memRender() {
    var list = document.getElementById('mem-page-list');
    var filtered = memCurrentFilter === 'all' ? memAllData : memAllData.filter(function(m){return m.type === memCurrentFilter;});
    document.getElementById('mem-count').textContent = filtered.length + ' 条';
    if (!filtered.length) {
        list.innerHTML = '<div class="mem-empty">暂无记忆</div>';
        return;
    }
    var typeLabels = {fact:'事实', preference:'偏好', experience:'经历', summary:'总结'};
    list.innerHTML = filtered.map(function(m) {
        var type = m.type || 'fact';
        var typeLabel = typeLabels[type] || type;
        var time = new Date(m.timestamp).toLocaleString('zh-CN', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
        var tags = (m.tags || []).map(function(t){return '<span class="mem-tag">'+escapeHtml(t)+'</span>';}).join('');
        return '<div class="mem-item">' +
            '<div class="mem-item-header">' +
            '<span class="mem-type '+type+'">'+typeLabel+'</span>' +
            '<span class="mem-time">'+time+'</span>' +
            '</div>' +
            '<div class="mem-content">'+escapeHtml(m.content||'')+'</div>' +
            '<div class="mem-item-footer">' +
            '<div class="mem-tags">'+tags+'</div>' +
            '<button class="mem-del" onclick="memDelete(\''+m._id+'\')">&times;</button>' +
            '</div>' +
            '</div>';
    }).join('');
}

async function memDelete(id) {
    if (!confirm('删除这条记忆？')) return;
    try {
        await fetch(BACKEND + '/api/memories/' + id, { method: 'DELETE' });
        memAllData = memAllData.filter(function(m){return m._id !== id;});
        memRender();
    } catch(e) { alert('删除失败'); }
}

// === Task Page ===
var taskAllData = [];
var taskCurrentFilter = 'all';

async function taskLoad() {
    try {
        var res = await fetch(BACKEND + '/api/tasks');
        var data = await res.json();
        taskAllData = data || [];
        taskRender();
    } catch(e) {
        document.getElementById('task-list').innerHTML = '<div class="task-empty">加载失败</div>';
    }
}

function taskFilter(type, btn) {
    taskCurrentFilter = type;
    document.querySelectorAll('.task-filter-btn').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
    taskRender();
}

function taskRender() {
    var list = document.getElementById('task-list');
    var filtered = taskAllData;
    if (taskCurrentFilter === 'pending') filtered = taskAllData.filter(function(t){return !t.completed;});
    else if (taskCurrentFilter === 'completed') filtered = taskAllData.filter(function(t){return t.completed;});
    var pendingCount = taskAllData.filter(function(t){return !t.completed;}).length;
    document.getElementById('task-count').textContent = pendingCount + ' 项待办';
    if (!filtered.length) {
        list.innerHTML = '<div class="task-empty">' + (taskCurrentFilter === 'completed' ? '还没有完成的任务' : '暂无任务，添加一个吧') + '</div>';
        return;
    }
    var priorityLabels = {high:'高', medium:'中', low:'低'};
    var creatorLabels = {user:'我', ai:'Lumi'};
    list.innerHTML = filtered.map(function(t) {
        var priority = t.priority || 'medium';
        var creator = t.createdBy || 'user';
        var dueDate = t.dueDate ? '<span class="task-due">📅 '+escapeHtml(t.dueDate)+'</span>' : '';
        return '<div class="task-item'+(t.completed?' completed':'')+'">' +
            '<div class="task-checkbox'+(t.completed?' checked':'')+'" onclick="taskToggle(\''+t._id+'\')">'+(t.completed?'✓':'')+'</div>' +
            '<div class="task-content">' +
            '<div class="task-text">'+escapeHtml(t.title||'')+'</div>' +
            '<div class="task-meta">' +
            '<span class="task-priority '+priority+'">'+priorityLabels[priority]+'</span>' +
            '<span class="task-creator">'+creatorLabels[creator]+'</span>' +
            dueDate +
            '</div>' +
            '</div>' +
            '<button class="task-del" onclick="taskDelete(\''+t._id+'\')">&times;</button>' +
            '</div>';
    }).join('');
}

async function taskAdd() {
    var input = document.getElementById('task-input');
    var title = input.value.trim();
    if (!title) return;
    var priority = document.getElementById('task-priority-select').value;
    input.value = '';
    try {
        var res = await fetch(BACKEND + '/api/tasks', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: title, priority: priority, createdBy: 'user' })
        });
        if (!res.ok) throw new Error(await res.text());
        var task = await res.json();
        taskAllData.unshift(task);
        taskRender();
    } catch(e) { alert('添加失败: ' + e.message); }
}

async function taskToggle(id) {
    try {
        var res = await fetch(BACKEND + '/api/tasks/' + id + '/toggle', { method: 'PATCH' });
        if (!res.ok) throw new Error(await res.text());
        var updated = await res.json();
        var idx = taskAllData.findIndex(function(t){return t._id === id;});
        if (idx >= 0) {
            taskAllData[idx].completed = updated.completed;
            taskAllData[idx].completedAt = updated.completedAt;
        }
        taskRender();
    } catch(e) { alert('操作失败'); }
}

async function taskDelete(id) {
    if (!confirm('删除这个任务？')) return;
    try {
        await fetch(BACKEND + '/api/tasks/' + id, { method: 'DELETE' });
        taskAllData = taskAllData.filter(function(t){return t._id !== id;});
        taskRender();
    } catch(e) { alert('删除失败'); }
}
