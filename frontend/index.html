<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Companion</title>
<style>
:root {
    --bg: #ffffff; --bg2: #f5f5f5; --bg3: #e8e8e8;
    --text: #1a1a1a; --text2: #666; --text3: #999;
    --accent: #6c5ce7; --accent2: #a29bfe;
    --border: #e0e0e0; --shadow: 0 2px 12px rgba(0,0,0,0.06);
    --radius: 12px; --radius-sm: 8px;
    --font: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
}
@media (prefers-color-scheme: dark) {
    :root {
        --bg: #1a1a2e; --bg2: #16213e; --bg3: #0f3460;
        --text: #e4e4e4; --text2: #a0a0a0; --text3: #666;
        --accent: #a29bfe; --accent2: #6c5ce7;
        --border: #2a2a4a; --shadow: 0 2px 12px rgba(0,0,0,0.2);
    }
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: var(--font); background: var(--bg); color: var(--text);
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
}
header {
    padding: 12px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--bg); z-index: 10;
}
header h1 { font-size: 18px; font-weight: 600; }
header select {
    padding: 6px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: var(--bg2); color: var(--text); font-size: 13px; cursor: pointer;
}
header button {
    padding: 6px 14px; border: none; border-radius: var(--radius-sm);
    background: var(--accent); color: #fff; font-size: 13px; cursor: pointer;
}
header button:hover { opacity: 0.85; }
#chat { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 16px; }
.msg { max-width: 80%; padding: 12px 16px; border-radius: var(--radius); line-height: 1.6; font-size: 14px; word-wrap: break-word; }
.msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
.msg.assistant { align-self: flex-start; background: var(--bg2); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.msg .time { font-size: 10px; color: var(--text3); margin-top: 6px; display: block; }
.think-block {
    align-self: flex-start; width: 100%; max-width: 80%;
    background: var(--bg2); border-radius: var(--radius); border: 1px solid var(--border);
    overflow: hidden; margin-bottom: -8px;
}
.think-block summary {
    padding: 8px 16px; cursor: pointer; font-size: 12px; color: var(--text2);
    display: flex; align-items: center; gap: 6px; user-select: none; list-style: none;
}
.think-block summary::-webkit-details-marker { display: none; }
.think-block .think-content {
    padding: 0 16px 12px; font-size: 13px; color: var(--text2); line-height: 1.6;
    white-space: pre-wrap; border-top: 1px solid var(--border); padding-top: 10px;
}
.msg code { font-size: 13px; background: rgba(0,0,0,0.06); padding: 2px 6px; border-radius: 4px; }
@media (prefers-color-scheme: dark) {
    .msg code { background: rgba(255,255,255,0.08); }
}
#input-area {
    padding: 12px 20px; border-top: 1px solid var(--border);
    display: flex; gap: 8px; background: var(--bg);
}
#input-area textarea {
    flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--bg2); color: var(--text); font-size: 14px; resize: none;
    outline: none; font-family: var(--font); line-height: 1.4; max-height: 120px;
}
#input-area textarea:focus { border-color: var(--accent); }
#input-area button {
    padding: 0 20px; border: none; border-radius: var(--radius);
    background: var(--accent); color: #fff; font-size: 14px; font-weight: 500;
    cursor: pointer; white-space: nowrap;
}
#input-area button:disabled { opacity: 0.4; cursor: not-allowed; }
.panel {
    display: none; position: fixed; top: 0; right: 0; bottom: 0;
    width: 360px; max-width: 100vw; background: var(--bg);
    border-left: 1px solid var(--border); z-index: 100;
    flex-direction: column; box-shadow: -4px 0 20px rgba(0,0,0,0.1);
}
.panel.open { display: flex; }
.panel-header {
    padding: 14px 16px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
}
.panel-header h3 { font-size: 15px; }
.panel-header button { background: none; border: none; color: var(--text3); font-size: 20px; cursor: pointer; }
.panel-header .danger { font-size: 12px; color: #e74c3c; margin-right: 8px; }
.panel-body { flex: 1; overflow-y: auto; padding: 12px 16px; }
.panel-body .item {
    padding: 10px 12px; background: var(--bg2); border-radius: var(--radius-sm);
    margin-bottom: 8px; font-size: 13px; line-height: 1.5;
}
.panel-body .item .label { font-size: 11px; color: var(--text3); margin-bottom: 4px; }
.overlay {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.3); z-index: 99;
}
.overlay.open { display: block; }
@media (max-width: 600px) {
    .msg, .think-block { max-width: 90%; }
    .panel { width: 100%; }
}
</style>
</head>
<body>
<header>
    <h1>AI Companion</h1>
    <div style="display:flex;gap:8px;align-items:center">
        <select id="model-select">
            <option value="openai/o3-mini">o3-mini (快速)</option>
            <option value="anthropic/claude-sonnet-4-20250514">Claude Sonnet 4 (平衡)</option>
            <option value="deepseek/deepseek-r1">DeepSeek R1 (深度推理)</option>
        </select>
        <button onclick="togglePanel('memories')">记忆</button>
    </div>
</header>
<div id="chat">
    <div style="text-align:center;color:var(--text3);font-size:13px;padding:40px 0;">
        开始对话吧！我有推理 + 工具调用能力 &#128170;
    </div>
</div>
<div id="input-area">
    <textarea id="input" rows="1" placeholder="输入消息..." onkeydown="handleKey(event)"></textarea>
    <button id="send-btn" onclick="send()">发送</button>
</div>
<div class="overlay" id="overlay" onclick="closePanel()"></div>
<div class="panel" id="memories-panel">
    <div class="panel-header">
        <h3>记忆</h3>
        <div>
            <button class="danger" onclick="clearMemories()">清除</button>
            <button onclick="closePanel()">X</button>
        </div>
    </div>
    <div class="panel-body" id="memories-list"></div>
</div>
<script>
var BACKEND = '';
var loading = false;

async function send() {
    var input = document.getElementById('input');
    var text = input.value.trim();
    if (!text || loading) return;
    input.value = '';
    loading = true;
    document.getElementById('send-btn').disabled = true;

    addMessage('user', text);
    var placeholder = addThinking();

    try {
        var res = await fetch(BACKEND + '/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text })
        });
        if (!res.ok) throw new Error(await res.text());
        var data = await res.json();

        if (placeholder) { placeholder.remove(); }

        var reply = data.reply || '';
        var idx = reply.indexOf('【回答】');
        if (idx > -1) {
            var thinkText = reply.substring(0, idx).replace('【思考】', '').trim();
            var answerText = reply.substring(idx + 4).replace('【回答】', '').trim();
            if (thinkText) addThinkingBlock(thinkText);
            if (answerText) addMessage('assistant', answerText);
        } else {
            addMessage('assistant', reply);
        }
    } catch (err) {
        if (placeholder) placeholder.remove();
        addMessage('assistant', '错误: ' + err.message);
    }
    loading = false;
    document.getElementById('send-btn').disabled = false;
}

function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
}

function addMessage(role, content) {
    var chat = document.getElementById('chat');
    var div = document.createElement('div');
    div.className = 'msg ' + role;
    var html = content
        .replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/\n/g, '<br>');
    var time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    div.innerHTML = html + '<span class="time">' + time + '</span>';
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function addThinking() {
    var chat = document.getElementById('chat');
    var d = document.createElement('details');
    d.className = 'think-block';
    d.open = true;
    d.innerHTML = '<summary>思考中...</summary><div class="think-content"></div>';
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
    return d;
}

function addThinkingBlock(text) {
    var chat = document.getElementById('chat');
    var d = document.createElement('details');
    d.className = 'think-block';
    d.open = false;
    var snippet = text.length > 80 ? text.slice(0, 80) + '...' : text;
    d.innerHTML = '<summary>' + snippet + '</summary><div class="think-content">' + text + '</div>';
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
}

function togglePanel(name) {
    var p = document.getElementById(name + '-panel');
    var o = document.getElementById('overlay');
    var isOpen = p.classList.contains('open');
    p.classList.toggle('open');
    o.classList.toggle('open');
    if (!isOpen && name === 'memories') loadMemories();
}

function closePanel() {
    document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('open'); });
    document.getElementById('overlay').classList.remove('open');
}

async function loadMemories() {
    try {
        var res = await fetch(BACKEND + '/api/memories');
        var data = await res.json();
        var list = document.getElementById('memories-list');
        if (!data || !data.length) {
            list.innerHTML = '<div style="color:var(--text3);font-size:13px;text-align:center;padding:20px">暂无记忆</div>';
            return;
        }
        list.innerHTML = data.map(function(m) {
            return '<div class="item"><div class="label">' + new Date(m.timestamp).toLocaleString() + '</div>' + (m.content || '') + '</div>';
        }).join('');
    } catch(e) {
        document.getElementById('memories-list').innerHTML = '<div style="color:red;font-size:13px">加载失败</div>';
    }
}

async function clearMemories() {
    if (!confirm('确定清除所有记忆和对话？')) return;
    try {
        await fetch(BACKEND + '/api/memories', { method: 'DELETE' });
        document.getElementById('chat').innerHTML = '<div style="text-align:center;color:var(--text3);font-size:13px;padding:40px 0;">已清除</div>';
        document.getElementById('memories-list').innerHTML = '<div style="color:var(--text3);font-size:13px;text-align:center;padding:20px">已清除</div>';
    } catch(e) { alert('清除失败'); }
}

document.getElementById('input').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});
</script>
</body>
</html>
